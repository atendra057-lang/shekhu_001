<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">

  <defs>
    <pattern id="gis-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#10283B" stroke-width="0.25" stroke-opacity="0.18" />
      <circle cx="60" cy="60" r="0.8" fill="#657762" fill-opacity="0.32" />
    </pattern>
    <pattern id="gis-subgrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#10283B" stroke-width="0.12" stroke-opacity="0.09" />
    </pattern>
    <pattern id="gis-diag-sage" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#657762" stroke-width="0.55" stroke-opacity="0.36" />
    </pattern>
    <pattern id="gis-diag-navy" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#10283B" stroke-width="0.45" stroke-opacity="0.24" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#gis-subgrid)" />
  <rect width="1600" height="900" fill="url(#gis-grid)" />
  
